[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-militarypay"
version = "0.1.0"
description = "MCP server for U.S. military pay rate tables (DFAS basic pay & BAS, DTMO BAH)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    # http2 extra: the DoD WAF fingerprints clients, and an agent claiming to
    # be Chrome while speaking HTTP/1.1 is a mismatch it can notice.
    "httpx[http2]>=0.27",
    # Reading the DTMO rates workbook, which is the only published form the
    # off-cycle BAH adjustments appear in.
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "anyio>=4.0"]  # anyio provides the pytest plugin the async server tests use

[project.scripts]
militarypay-ingest = "mcp_militarypay.cli:main"
militarypay-mcp = "mcp_militarypay.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mcp_militarypay = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A warning from our own code is a defect we have not looked at yet, so fail on
# it. Third-party deprecations get added here explicitly rather than ignored
# wholesale.
filterwarnings = ["error"]
